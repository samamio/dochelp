<script>
  const TIER = {
    low: { label:'低进展风险', text:'text-emerald-700', badgeBg:'bg-emerald-100', badgeText:'text-emerald-800', softBg:'bg-emerald-50', softText:'text-emerald-900', softIcon:'text-emerald-700', gradient:'from-emerald-500 via-teal-500 to-primary', dot:'bg-emerald-500' },
    intermediate: { label:'中进展风险', text:'text-amber-700', badgeBg:'bg-amber-100', badgeText:'text-amber-800', softBg:'bg-amber-50', softText:'text-amber-900', softIcon:'text-amber-700', gradient:'from-amber-500 via-orange-500 to-primary', dot:'bg-amber-500' },
    high: { label:'高进展风险', text:'text-red-700', badgeBg:'bg-red-100', badgeText:'text-red-800', softBg:'bg-red-50', softText:'text-red-900', softIcon:'text-red-700', gradient:'from-red-500 via-rose-500 to-primary', dot:'bg-red-500' },
    insufficient: { label:'信息不足', text:'text-slate-700', badgeBg:'bg-slate-100', badgeText:'text-slate-800', softBg:'bg-slate-50', softText:'text-slate-900', softIcon:'text-slate-700', gradient:'from-slate-400 to-primary', dot:'bg-slate-400' },
  };

  function tierKey(riskLevel) {
    if (riskLevel === 'low') return 'low';
    if (riskLevel === 'intermediate') return 'intermediate';
    if (riskLevel === 'high') return 'high';
    return 'insufficient';
  }

  function cutoffLabel(tier, ageGroup) {
    if (tier === 'insufficient') return '—';
    if (ageGroup === '>=65') {
      if (tier === 'low') return 'CUT-OFF < 2.00';
      if (tier === 'intermediate') return 'CUT-OFF 2.00 – 2.67';
      return 'CUT-OFF > 2.67';
    }
    if (tier === 'low') return 'CUT-OFF < 1.30';
    if (tier === 'intermediate') return 'CUT-OFF 1.30 – 2.67';
    return 'CUT-OFF > 2.67';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function renderResult(result) {
    const tier = tierKey(result.riskLevel);
    const t = TIER[tier];
    const code = (result.id || '').replace(/-/g,'').substring(0,8).toUpperCase();
    const fib4Display = result.fib4Computed ? result.fib4 : '—';
    const cutoff = cutoffLabel(tier, result.ageGroup);
    const nextStepParas = (result.nextStep && result.nextStep.paragraphs || []).map(p => `<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">${esc(p)}</p>`).join('');

    // 重点提示（超声异常）
    let specialPrompt = '';
    if (result.ultrasound && result.ultrasound.alert) {
      specialPrompt = `
      <div class="bg-error-container rounded-xl p-space-lg flex flex-col gap-space-xs border-l-4 border-error">
        <div class="flex items-center gap-space-xs text-on-error-container font-headline-sm text-headline-sm">
          <span class="material-symbols-outlined text-[20px]">warning</span>
          <span>重点提示</span>
        </div>
        <p class="font-body-md text-body-md text-on-error-container leading-relaxed">${esc(result.ultrasound.prompt)}</p>
      </div>`;
    }

    // 转诊核查
    let referralCard;
    if (result.referral && result.referral.triggered) {
      const reasons = (result.referral.reasons || []).map(r => `<li class="flex items-start gap-space-xs"><span class="material-symbols-outlined text-[18px] text-error mt-0.5">error</span><span class="font-body-md text-body-md text-on-surface">${esc(r)}</span></li>`).join('');
      referralCard = `
      <div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-space-md border-l-4 border-error">
        <div class="flex items-center gap-space-md">
          <div class="w-8 h-8 rounded-full bg-error-container flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-on-error-container text-[18px]">rule</span>
          </div>
          <div class="flex flex-col">
            <span class="font-label-md text-label-md text-on-surface font-semibold">建议进一步专科评估</span>
            <span class="font-body-sm text-body-sm text-on-surface-variant">触发原因：</span>
            <ul class="mt-1 flex flex-col gap-1">${reasons}</ul>
          </div>
        </div>
        <div class="shrink-0 px-space-md py-1 rounded bg-error-container text-on-error-container font-code-reference text-code-reference font-semibold">
          需专科评估
        </div>
      </div>`;
    } else {
      referralCard = `
      <div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-space-md">
        <div class="flex items-center gap-space-md">
          <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-emerald-800 text-[18px]">rule</span>
          </div>
          <div class="flex flex-col">
            <span class="font-label-md text-label-md text-on-surface font-semibold">专科转诊核查通过</span>
            <span class="font-body-sm text-body-sm text-on-surface-variant">未触发转诊规则：${esc(result.riskLabel)}，腹部超声无弥漫性硬化改变或局灶性实性占位。</span>
          </div>
        </div>
        <div class="shrink-0 px-space-md py-1 rounded bg-emerald-50 text-emerald-800 font-code-reference text-code-reference font-semibold">
          非危急重症通道
        </div>
      </div>`;
    }

    // LSM 提示（若提供）
    let lsmCard = '';
    if (result.lsm && result.lsm.value != null) {
      lsmCard = `
      <div class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm flex items-center gap-space-md">
        <div class="w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-primary text-[18px]">monitor_heart</span>
        </div>
        <div class="flex flex-col">
          <span class="font-label-md text-label-md text-on-surface font-semibold">瞬时弹性成像 LSM：${esc(result.lsm.value)} kPa</span>
          <span class="font-body-sm text-body-sm text-on-surface-variant">${esc(result.lsm.message)}</span>
        </div>
      </div>`;
    }

    const html = `
    <div class="w-full bg-surface-container-lowest rounded-xl shadow-md p-space-xl flex flex-col gap-space-xl relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r ${t.gradient}"></div>
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-space-md">
        <div class="flex flex-col">
          <div class="flex items-center gap-space-xs text-primary font-label-sm text-label-sm font-semibold tracking-wider uppercase">
            <span class="material-symbols-outlined text-[18px]">verified</span>
            <span>Clinical Pathway Decision</span>
          </div>
          <h1 class="font-headline-lg text-headline-lg text-on-surface font-semibold tracking-tight mt-0.5">患者下一步管理路径</h1>
        </div>
        <div class="flex items-center gap-space-sm bg-surface-container px-space-md py-1.5 rounded-lg self-start sm:self-auto">
          <span class="font-body-sm text-body-sm text-on-surface-variant">门诊编号:</span>
          <span class="font-code-metric text-code-metric text-on-surface font-semibold">MAFLD-${esc(code || '--------')}</span>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-12 gap-space-lg items-stretch">
        <div class="md:col-span-5 bg-surface-container-low rounded-xl p-space-lg flex flex-col justify-between relative">
          <div class="flex items-center justify-between">
            <span class="font-label-md text-label-md text-on-surface-variant font-medium">肝纤维化评估指数 (FIB-4)</span>
            <span class="px-space-sm py-0.5 rounded-DEFAULT ${t.badgeBg} ${t.badgeText} font-code-reference text-code-reference font-semibold">${esc(cutoff)}</span>
          </div>
          <div class="my-space-md flex items-baseline gap-space-sm">
            <span class="font-display-score text-display-score text-on-surface tracking-tight font-bold">${esc(fib4Display)}</span>
            <span class="font-label-md text-label-md ${t.text} font-semibold">${esc(result.riskLabel)}</span>
          </div>
          <div class="flex items-center gap-space-xs ${t.softBg} ${t.softText} px-space-md py-space-sm rounded-lg">
            <span class="material-symbols-outlined ${t.softIcon} text-[20px]" style="font-variation-settings: 'FILL' 1;">${tier==='insufficient'?'info':'check_circle'}</span>
            <div class="flex flex-col">
              <span class="font-label-sm text-label-sm font-bold leading-tight">${esc(t.label)}</span>
              <span class="font-body-sm text-body-sm leading-tight">${tier==='insufficient'?'信息不足，无法完成 FIB-4 风险评估':'依据年龄校正 FIB-4 阈值分层'}</span>
            </div>
          </div>
        </div>

        <div class="md:col-span-7 bg-surface-container-high rounded-xl p-space-lg flex flex-col justify-between">
          <div class="flex items-start gap-space-md">
            <div class="w-10 h-10 rounded-lg bg-primary flex items-center justify-center shrink-0 mt-0.5">
              <span class="material-symbols-outlined text-on-primary text-[22px]">directions_walk</span>
            </div>
            <div class="flex flex-col gap-1">
              <span class="font-label-sm text-label-sm text-primary font-bold uppercase tracking-wider">下一步处置原则</span>
              <h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold">${esc((result.nextStep && result.nextStep.title) || '下一步')}</h2>
              <div class="flex flex-col gap-2 mt-1">${nextStepParas}</div>
            </div>
          </div>
          <div class="mt-space-md pt-space-sm bg-surface-container-lowest/80 rounded-lg p-space-md flex items-center justify-between gap-space-xs">
            <div class="flex items-center gap-1.5 font-code-reference text-code-reference ${t.text} font-semibold">
              <span class="w-2.5 h-2.5 rounded-full ${t.dot}"></span>
              <span>基层诊疗路径</span>
            </div>
            <span class="text-outline text-body-sm font-body-sm">|</span>
            <span class="font-body-sm text-body-sm text-on-surface-variant truncate">适宜管理场所：社区卫生服务中心 / 综合门诊</span>
            <span class="material-symbols-outlined text-primary text-[18px]">verified_user</span>
          </div>
        </div>
      </div>

      ${specialPrompt}
      ${referralCard}
      ${lsmCard}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
        <div class="bg-surface-container-low rounded-xl p-space-lg flex flex-col gap-space-sm">
          <div class="flex items-center gap-space-xs text-tertiary">
            <span class="material-symbols-outlined text-[20px]">fitness_center</span>
            <span class="font-headline-sm text-headline-sm font-semibold text-on-surface">生活方式与代谢控制</span>
          </div>
          <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">${esc(result.followUp.management)}</p>
          <div class="mt-auto pt-space-xs flex flex-wrap gap-1.5">
            <span class="bg-surface-container px-2 py-0.5 rounded text-on-surface font-label-sm text-label-sm">减重目标: 5%~7%</span>
            <span class="bg-surface-container px-2 py-0.5 rounded text-on-surface font-label-sm text-label-sm">有氧运动: 150min/周</span>
          </div>
        </div>
        <div class="bg-surface-container-low rounded-xl p-space-lg flex flex-col gap-space-sm">
          <div class="flex items-center gap-space-xs text-primary">
            <span class="material-symbols-outlined text-[20px]">event_repeat</span>
            <span class="font-headline-sm text-headline-sm font-semibold text-on-surface">随访复查建议周期</span>
          </div>
          <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">${esc(result.followUp.recheck)}</p>
          <div class="mt-auto pt-space-xs flex flex-wrap gap-1.5">
            <span class="bg-surface-container-highest px-2 py-0.5 rounded text-primary font-label-sm text-label-sm font-medium">3~6 个月: 生化全套</span>
            <span class="bg-surface-container-highest px-2 py-0.5 rounded text-primary font-label-sm text-label-sm font-medium">6~12 个月: 腹部B超+FIB-4</span>
          </div>
        </div>
      </div>

      <div class="pt-space-md flex flex-col sm:flex-row items-center justify-between gap-space-md">
        <div class="flex flex-wrap items-center gap-space-sm w-full sm:w-auto">
          <button class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-space-xs bg-primary hover:opacity-95 text-on-primary px-space-xl py-2.5 rounded-lg font-label-md text-label-md font-semibold transition-all shadow-sm active:scale-98" id="btnGenerateHandout" type="button">
            <span class="material-symbols-outlined text-[20px]">print</span>
            <span>生成患者说明 / 打印宣教单</span>
          </button>
          <button class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-space-xs bg-surface-container hover:bg-surface-container-high text-on-surface px-space-lg py-2.5 rounded-lg font-label-md text-label-md font-medium transition-all active:scale-98" id="btnCopyRecord" type="button">
            <span class="material-symbols-outlined text-[18px]" id="copyIcon">content_copy</span>
            <span id="copyText">一键复制临床决策记录</span>
          </button>
        </div>
        <button class="text-on-surface-variant hover:text-primary font-label-md text-label-md inline-flex items-center gap-1 transition-colors self-center" id="btnReassess" type="button">
          <span class="material-symbols-outlined text-[18px]">restart_alt</span>
          <span>重新录入参数</span>
        </button>
      </div>

      <div class="bg-surface-container-low px-space-lg py-space-sm rounded-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-space-xs font-body-sm text-body-sm text-outline">
        <div class="flex items-center gap-space-xs">
          <span class="material-symbols-outlined text-[18px] text-primary">auto_stories</span>
          <span class="text-on-surface-variant font-medium">指南依据：</span>
          <span class="text-on-surface font-semibold">《${esc(result.guideline.name)}（${esc(result.guideline.year)}年版）》</span>
        </div>
        <span class="font-code-reference text-code-reference text-outline">规则版本：${esc(result.guideline.ruleVersion)}</span>
      </div>
    </div>`;

    document.getElementById('result-root').innerHTML = html;
    wireResultActions(result);
  }

  let CURRENT_RESULT = null;
  function wireResultActions(result) {
    CURRENT_RESULT = result;
    const btnCopy = document.getElementById('btnCopyRecord');
    const copyText = document.getElementById('copyText');
    const copyIcon = document.getElementById('copyIcon');
    const btnGenerate = document.getElementById('btnGenerateHandout');
    const handoutModal = document.getElementById('handoutModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnReassess = document.getElementById('btnReassess');

    // 患者说明弹窗内容
    const body = document.getElementById('handout-body');
    if (body) body.textContent = (result.patientExplanation || '').replace(/\\n/g, '\n');

    if (btnCopy) {
      btnCopy.addEventListener('click', async () => {
        const content = buildEmrContent(result);
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(content);
          } else {
            const ta = document.createElement('textarea');
            ta.value = content; document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta);
          }
          copyIcon.textContent = 'check';
          copyText.textContent = '已复制到剪贴板';
          btnCopy.classList.add('bg-emerald-100','text-emerald-900');
          setTimeout(() => {
            copyIcon.textContent = 'content_copy';
            copyText.textContent = '一键复制临床决策记录';
            btnCopy.classList.remove('bg-emerald-100','text-emerald-900');
          }, 2500);
        } catch (e) {
          copyText.textContent = '复制失败，请手动选取';
        }
      });
    }
    if (btnGenerate && handoutModal) {
      btnGenerate.addEventListener('click', () => {
        handoutModal.classList.remove('hidden');
        handoutModal.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    }
    if (btnCloseModal && handoutModal) {
      btnCloseModal.addEventListener('click', () => handoutModal.classList.add('hidden'));
    }
    if (btnReassess) {
      btnReassess.addEventListener('click', () => { window.location.href = 'assessment.html'; });
    }
  }

  function buildEmrContent(r) {
    const lines = [];
    lines.push('【MAFLD 门诊临床决策记录】');
    lines.push('评估工具：FIB-4 肝纤维化无创评分（依据 ' + (r.guideline ? r.guideline.year : 2025) + ' 基层指南）');
    if (r.fib4Computed) {
      lines.push('计算数值：' + r.fib4 + '（' + r.riskLabel + '）');
    } else {
      lines.push('FIB-4：信息不足，无法计算（请补充 ALT、AST、血小板）');
    }
    if (r.ultrasound && r.ultrasound.value && r.ultrasound.value !== 'not_done') {
      lines.push('腹部超声：' + usLabel(r.ultrasound.value));
    }
    if (r.lsm && r.lsm.value != null) {
      lines.push('瞬时弹性成像 LSM：' + r.lsm.value + ' kPa — ' + r.lsm.message);
    }
    const ns = (r.nextStep && r.nextStep.paragraphs || []).join(' ');
    lines.push('处理意见：' + ns);
    if (r.referral && r.referral.triggered) {
      lines.push('转诊提示：建议进一步专科评估。触发原因：' + (r.referral.reasons || []).join('；'));
    }
    lines.push('随访规划：' + r.followUp.management + ' ' + r.followUp.recheck);
    lines.push('依据标准：《' + (r.guideline ? r.guideline.name : '代谢相关脂肪性肝病基层诊疗与管理指南') + '（' + (r.guideline ? r.guideline.year : 2025) + '年版）》');
    return lines.join('\n');
  }

  function usLabel(v) {
    return { steatosis:'脂肪肝表现', cirrhosis:'疑似肝硬化', mass:'肝脏占位', other:'其他/不确定', not_done:'未检查' }[v] || v;
  }

  function init() {
    const root = document.getElementById('result-root');
    let raw = null;
    try { raw = sessionStorage.getItem('mafld_current'); } catch (e) { raw = null; }
    if (!raw) {
      root.innerHTML = '<div class="w-full bg-surface-container-lowest rounded-xl shadow-md p-space-xl text-center text-on-surface-variant">未找到评估参数，请返回重新录入。<div class="mt-space-md"><a href="assessment.html" class="text-primary font-label-md">前往评估工作台</a></div></div>';
      return;
    }
    try {
      const result = JSON.parse(raw);
      renderResult(result);
    } catch (e) {
      root.innerHTML = '<div class="w-full bg-surface-container-lowest rounded-xl shadow-md p-space-xl text-center text-on-surface-variant">评估结果载入失败，请返回重新评估。</div>';
    }
  }

  init();
</script>
</body></html>
